<!DOCTYPE html PUBLIC>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>后台管理中心</title>
    <link rel="stylesheet" href="/admin/css/pintuer.css"/>
    <link rel="stylesheet" href="/admin/css/admin.css"/>
    <link href="/admin/css/bootstrap.min.css" rel="stylesheet" type="text/css" media="all"/>
    <script src="/admin/js/jquery.min.js" type="text/javascript" charset="utf-8"></script>
    <script src="/admin/js/bootstrap.min.js" type="text/javascript" charset="utf-8"></script>
    <script src="/admin/js/pintuer.js"></script>
    <script src="/public/js/vue.js"></script>
    <script src="/public/js/axios.js"></script>
    <script src="/public/js/axios-config.js"></script>
</head>
<body>
<div id="app">
    <!-- 显示影人详情的模态框 Modal -->
    <div class="modal modal-lg fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">{{ curItem.name }}</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!--简介-->
                    <div v-show="type==0" v-html="curItem.info"></div>
                    <!--海报-->
                    <div v-show="type==1">
                        <img v-bind:src="curItem.post" style="width: 100%">
                    </div>
                    <!--视频-->
                    <div v-show="type==2" >
                        <video controls v-bind:src="curItem.playLink" style="width: 100%;height: 100%"></video>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
    <!-- // Modal-->
    <div class="panel admin-panel">
        <div class="panel-head"><strong class="icon-reorder"> 影片管理</strong></div>
        <div class="padding border-bottom">
            <ul class="search">
                <li>
                    <input @keyup.enter="loadData()" v-model="params.name" class="input"
                           type="text" placeholder="输入电影名称快速查找">
                </li>
                <li>
                    <button @click="loadData()" class="button border-blue">
                        <span class="icon-search"></span> 查询
                    </button>
                </li>
                <li>
                    <a class="button border-green" href="/admin/film/updateoradd.html">
                        <span class="icon-edit"></span> 添加</a>
                </li>
            </ul>
        </div>
        <table class="table table-hover text-center">
            <thead>
            <tr>
                <th>编号</th>
                <th>名称</th>
                <th>封面</th>
                <th>发行国家</th>
                <th>语言</th>
                <th>上映日期</th>
                <th>时长</th>
                <th>累计票房</th>
                <th>状态</th>
                <th>放映格式</th>
                <th>其他信息</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
                <!--在这里遍历列表显示记录-->
                <tr v-for="item in list">
                    <td>{{item.id}}</td>
                    <td>{{item.name}}</td>
                    <td>
                        <img v-bind:src="item.cover" height="100">
                    </td>
                    <td>{{item.country}}</td>
                    <td>{{item.language}}</td>
                    <td>{{item.releaseDate}}</td>
                    <td>{{item.length}}</td>
                    <td>{{item.boxOffice}}</td>
                    <td>
                        <span v-if="item.status==0">制作中</span>
                        <span v-else-if="item.status==1">待上映</span>
                        <span v-else-if="item.status==2">上映中</span>
                        <span v-else-if="item.status==3">已停播</span>
                    </td>
                    <td>{{item.version}}</td>
                    <td>
                        <a target="_blank" v-bind:href="item.ticketLink" class="btn btn-link">购票链接</a>
                        <a href="#" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#exampleModal" @click="show(item,0)">影片详情</a>
                        <a href="#" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#exampleModal" @click="show(item,1)">查看海报</a>
                        <a href="#" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#exampleModal" @click="show(item,2)">播放链接</a>
                    </td>
                    <td>
                        <a class="btn btn-sm btn-warning" :href="'updateoradd.html?id=' + item.id">修改</a>
                        <button class="btn btn-sm btn-danger" @click="del(item.id)">删除</button>
                    </td>
                </tr>
                <tr>
                    <td colspan="13" align="center">
                        <nav aria-label="Page navigation ">
                            <ul class="pagination">
                                <li class="page-item" v-if="page.hasPreviousPage">
                                    <a class="page-link" href="#" @click="goto(page.prePage)">上一页</a>
                                </li>
                                <li :class="'page-item ' + (page.pageNum===item?'active':'')"
                                    v-for="item in page.navigatepageNums">
                                    <a class="page-link"  href="#" @click="goto(item)">{{ item }}</a>
                                </li>
                                <li class="page-item" v-if="page.hasNextPage">
                                    <a class="page-link" href="#" @click="goto(page.nextPage)">下一页</a>
                                </li>
                            </ul>
                        </nav>
                    </td>
                </tr>
            </tbody>

        </table>
    </div>
</div>
<script type="text/javascript">
    const app = new Vue({
        'el': '#app',
        'data': {
            list: [{}],
            page: {},
            curItem: {},
            type: null,
            params: {
                pageNum: 1,
                pageSize: 5,
                name: null
            }
        },
        'methods': {
            del(id) {
                if (confirm("确认要删除吗？")){
                    let url=`/api/v1/film/remove/${id}`//``~~
                    axios.post(url)
                        .then(res =>{
                            alert(res.message)
                            if (res.code == 200)
                                this.loadData()
                        })
                }

            },
            show(item, type) {
                this.curItem = item
                this.type = type
                if (type==2){
                    //自动播放
                    document.querySelector("#exampleModal video").play()
                }
            },
            goto(pn) {
                this.params.pageNum = pn
                this.loadData()
            },
            loadData() {
                let url = '/api/v1/film/page'
                axios.post(url,this.params)
                    .then(res =>{
                        this.page = res.data
                        this.list = res.data.list
                    })
            }
        },
        mounted() {
            // 手动调用分页查询的函数
            this.loadData()
        }
    })

    const exampleModal = document.getElementById("exampleModal")
    //显示模态框时开始视频
    exampleModal.addEventListener("show.bs.modal",function () {
        if (app.type == 2)
            exampleModal.querySelector('video').play()

    })
    //关闭时暂停视频
    exampleModal.addEventListener("hidden.bs.modal",function () {
        exampleModal.querySelector('video').pause()
    })
</script>
</body>
</html>
