<!DOCTYPE html PUBLIC>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>后台管理中心</title>
    <link rel="stylesheet" href="/admin/css/pintuer.css"/>
    <link rel="stylesheet" href="/admin/css/admin.css"/>
    <link href="/admin/css/bootstrap.min.css" rel="stylesheet" type="text/css" media="all"/>
    <script src="/admin/js/jquery.min.js" type="text/javascript" charset="utf-8"></script>
    <script src="/admin/js/bootstrap.min.js" type="text/javascript" charset="utf-8"></script>
    <script src="/admin/js/pintuer.js"></script>
    <script src="/public/js/vue.js"></script>
    <script src="/public/js/axios.js"></script>
    <script src="/public/js/axios-config.js"></script>
</head>
<body>
<div id="app">
    <!-- 显示影评详情的模态框 Modal -->
    <div class="modal modal-lg fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">{{ curItem.user.nickName }}</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div v-html="curItem.content"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success" @click="submitCheck(1)">审核通过</button>
                    <button class="btn btn-danger" @click="submitCheck(2)">审核不通过</button>
                </div>
            </div>
        </div>
    </div>
    <!-- // Modal-->
    <div class="panel admin-panel">
        <div class="panel-head"><strong class="icon-reorder"> 影评管理</strong></div>
        <div class="padding border-bottom">
            <ul class="search">
                <li>
                    <a class="button border-green" href="/admin/review/updateoradd.html">
                        <span class="icon-edit"></span> 添加</a>
                </li>
            </ul>
        </div>
        <table class="table table-hover text-center">
            <thead>
            <tr>
                <th>编号</th>
                <th>会员用户名</th>
                <th>会员昵称</th>
                <th>电影</th>
                <th>评论内容</th>
                <th>状态</th>
            </tr>
            </thead>
            <tbody>
                <!--在这里遍历列表显示记录-->
                <tr v-for="item in list">
                    <td>{{ item.id }}</td>
                    <td>{{item.user?item.user.username:'未知'}}</td>
                    <td>{{item.user?item.user.nickName:'未知'}}</td>
                    <td>{{item.film.name}}</td>
                    <td>
                        <div class="text-container">{{item.content}}</div>
                        <button class="btn btn-link" data-bs-toggle="modal" data-bs-target="#exampleModal" @click="show(item)">查看详情</button>
                    </td>
                    <td>
                        <span v-if="item.status==0" class="btn-info">未审核</span>
                        <span v-if="item.status==1" class="btn-success">已通过</span>
                        <span v-if="item.status==2" class="btn-danger">审核未通过</span>
                    </td>
                </tr>
                <tr>
                    <td colspan="6" align="center">
                        <nav aria-label="Page navigation ">
                            <ul class="pagination">
                                <li class="page-item" v-if="page.hasPreviousPage">
                                    <a class="page-link" href="#" @click="goto(page.prePage)">上一页</a>
                                </li>
                                <li :class="'page-item ' + (page.pageNum===item?'active':'')"
                                    v-for="item in page.navigatepageNums">
                                    <a class="page-link"  href="#" @click="goto(item)">{{ item }}</a>
                                </li>
                                <li class="page-item" v-if="page.hasNextPage">
                                    <a class="page-link" href="#" @click="goto(page.nextPage)">下一页</a>
                                </li>
                            </ul>
                        </nav>
                    </td>
                </tr>
            </tbody>

        </table>
    </div>
</div>
<script type="text/javascript">
    new Vue({
        'el': '#app',
        'data': {
            list: [],
            page: {},
            curItem:{
                user:{

                }
            },
            params:{
                pageNum: 1,
                pageSize: 5,
                status:null
            }
        },
        'methods': {
            show(item){
                this.curItem = item
            },
            submitCheck(status){
                let url = '/api/v1/review/updateStatus/{rid}/{status}'
                    .replace("{rid}",this.curItem.id)
                    .replace("{status}",status)
                axios.post(url)
                    .then(res=>{
                        alert(res.message)
                        this.loadData()
                        if (res.aode == 200) {
                            document.querySelector("#exampleModal .btn-close").click();
                        }
                    })
            },
            goto(pn) {
                this.params.pageNum = pn
                this.loadData()
            },
            loadData() {
                let url = '/api/v1/review/page'
                axios.post(url,this.params)
                    .then(res =>{
                        this.page =res.data
                        this.list = res.data.list
                    })
            }
        },
        mounted() {
            // 手动调用分页查询的函数
            this.loadData()
        }
    })


</script>
</body>
</html>
