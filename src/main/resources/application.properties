springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.example.frn.controller
springdoc.group-configs[0].group=v1
springdoc.group-configs[1].group=test
springdoc.group-configs[0].paths-to-match=/api/v1/**
springdoc.group-configs[1].paths-to-match=/test/**

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_film_review?useUnicode=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root

mybatis.mapper-locations=classpath:/mappers/*.xml
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.type-aliases-package=org.example.frn.entity
mybatis.configuration.map-underscore-to-camel-case=true

minio.endpoint=http://127.0.0.1:9000
minio.bucketName=test
minio.accessKey=admin
minio.secretKey=admin1234

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=1000MB
